<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HuangFei_Portfolio</title>
</head>
<body>
<!-- Canvas -->
<canvas id="experience-canvas"></canvas>

<!-- Loading Screen (tên, vai trò, lời chào theo ref được điền từ src/content.js) -->
<div class="loading-screen">
  <div class="loading-content">
    <h1 class="loading-title">Loading...</h1>
    <p class="loading-role"></p>
    <p class="loading-visitor" hidden></p>
    <div class="loading-bar">
      <div class="loading-progress"></div>
    </div>
    <p class="loading-percent">0%</p>
    <button class="loading-screen-button">Loading...</button>
    <p class="loading-hint">use left/right click and mouse wheel to navigate!</p>
    <p class="privacy-note">This site records basic visit data (IP, approximate location, clicks) for analytics.</p>
  </div>
</div>

<!-- Overlay UI -->
<nav id="ui-overlay">

  <button type="button" id="sound-toggle" class="menu-item" aria-label="Toggle music">🔊</button>

  <button type="button" class="menu-item" data-link="#mywork">MY WORK</button>
  <button type="button" class="menu-item" data-link="#contact">CONTACT</button>
  <button type="button" class="menu-item" data-link="#about">ABOUT</button>
</nav>


<script type="module" src="/src/main.js"></script>
</body>
</html>
