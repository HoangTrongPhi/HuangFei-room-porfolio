<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HuangFei_Portfolio</title>
</head>
<body>
<!-- Canvas -->
<canvas id="experience-canvas"></canvas>

<!-- Loading Screen (tên, vai trò, lời chào theo ref được điền từ src/content.js; bản vẽ phòng do src/ui/isoRoom.js tạo) -->
<div class="loading-screen">
  <div class="loading-grid" aria-hidden="true"></div>
  <div class="loading-content">
    <div class="loading-art"></div>
    <div class="loading-panel">
      <h1 class="loading-title">Loading...</h1>
      <p class="loading-role"></p>
      <p class="loading-visitor" hidden></p>
      <div class="loading-meter">
        <div class="loading-bar"><div class="loading-progress"></div></div>
        <span class="loading-percent">0%</span>
      </div>
      <ul class="loading-log" aria-label="Loading assets"></ul>
      <button class="loading-screen-button">Loading...</button>
      <p class="loading-hint">use left/right click and mouse wheel to navigate!</p>
      <p class="privacy-note">This site records basic visit data (IP, approximate location, clicks) for analytics.</p>
    </div>
  </div>
</div>

<!-- Overlay UI: dock kính bên phải (desktop) / thanh tab dưới đáy (điện thoại). Nhạc nằm ở widget HUD (src/ui/hud.js).
     data-key = phím tắt bàn phím -->
<nav id="ui-overlay" aria-label="Main">
  <p class="dock-title" aria-hidden="true">// navigate</p>
  <span class="dock-indicator" aria-hidden="true"></span>
  <button type="button" class="menu-item" data-link="#mywork" data-key="1" aria-keyshortcuts="1">
    <span class="menu-index" aria-hidden="true">01</span>
    <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    <span class="menu-label">MY WORK</span>
    <kbd class="menu-key" aria-hidden="true">1</kbd>
  </button>
  <button type="button" class="menu-item" data-link="#contact" data-key="2" aria-keyshortcuts="2">
    <span class="menu-index" aria-hidden="true">02</span>
    <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5 12 13l8.5-6.5"/></svg>
    <span class="menu-label">CONTACT</span>
    <kbd class="menu-key" aria-hidden="true">2</kbd>
  </button>
  <button type="button" class="menu-item" data-link="#about" data-key="3" aria-keyshortcuts="3">
    <span class="menu-index" aria-hidden="true">03</span>
    <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
    <span class="menu-label">ABOUT</span>
    <kbd class="menu-key" aria-hidden="true">3</kbd>
  </button>
  <button type="button" class="menu-item" data-link="#hobby" data-key="4" aria-keyshortcuts="4">
    <span class="menu-index" aria-hidden="true">04</span>
    <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10a5 5 0 0 1 4.6 7l-1.3 3a2.4 2.4 0 0 1-4 .6L14 15h-4l-2.3 2.6a2.4 2.4 0 0 1-4-.6l-1.3-3A5 5 0 0 1 7 7Z"/><path d="M7.5 10v3M6 11.5h3"/><circle cx="16" cy="11" r=".6"/><circle cx="17.5" cy="12.5" r=".6"/></svg>
    <span class="menu-label">HOBBY</span>
    <kbd class="menu-key" aria-hidden="true">4</kbd>
  </button>
</nav>


<script type="module" src="/src/main.js"></script>
</body>
</html>
